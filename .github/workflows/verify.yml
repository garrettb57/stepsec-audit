name: verify

# Ad-hoc API checks that cannot run from the Claude sandbox. Output goes to the job log.
on:
  workflow_dispatch:
    inputs:
      script:
        description: "Script under scripts/ to run"
        default: "verify_pr_bodies.py"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - env:
          GITHUB_TOKEN: ${{ secrets.CRAWLER_TOKEN || secrets.GITHUB_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/${{ inputs.script }}
