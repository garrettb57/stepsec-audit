name: crawl

# Manual runs only. Each run stops at time_budget_min, commits data/ and state/,
# and dispatches itself again (up to max_chain times) while work remains.
# See README.md.
on:
  workflow_dispatch:
    inputs:
      phase:
        description: "all | discover | owners | classify | repos | workflows | score | contacts | export"
        default: "all"
      limit:
        description: "Cap candidate repos (smoke test). Blank = no cap."
        default: ""
      actions:
        description: "Comma list of step-security action names to search. Blank = every public repo in the step-security org."
        default: ""
      time_budget_min:
        description: "Stop cleanly after this many minutes and commit state; the run re-dispatches itself if work remains."
        default: "330"
      extra_args:
        description: "Extra CLI flags, e.g. --smoke --limit 40, --skip-contacts, --contacts-top-accounts 200"
        default: ""
      chain:
        description: "Auto-chain depth of this run (set by the previous run; leave 0)."
        default: "0"
      max_chain:
        description: "Stop auto-chaining after this many follow-up runs."
        default: "4"

permissions:
  contents: write
  actions: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python -m pytest -q

      - name: Crawl
        env:
          # CRAWLER_TOKEN is required: a fine-grained PAT (public repositories, read-only)
          # with the 5,000 req/h REST and GraphQL budgets. The crawler fails fast on the
          # 1,000 req/h GITHUB_TOKEN budget.
          GITHUB_TOKEN: ${{ secrets.CRAWLER_TOKEN || secrets.GITHUB_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          ARGS="--phase ${{ inputs.phase }} --time-budget-min ${{ inputs.time_budget_min }}"
          if [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ inputs.limit }}"; fi
          if [ -n "${{ inputs.actions }}" ]; then ARGS="$ARGS --actions ${{ inputs.actions }}"; fi
          ARGS="$ARGS ${{ inputs.extra_args }}"
          echo "running: python -m crawler.main $ARGS (chain ${{ inputs.chain }}/${{ inputs.max_chain }})"
          python -m crawler.main $ARGS

      - name: Commit data and state
        if: always()
        run: |
          git config user.name "stepsec-audit crawler"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data state
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "crawl: update data and state ($(date -u +%Y-%m-%dT%H:%MZ), chain ${{ inputs.chain }})"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stepsec-csv
          path: data/
          if-no-files-found: ignore

      - name: Dispatch next run if work remains
        if: success()
        env:
          # GITHUB_TOKEN may dispatch workflow_dispatch events; the concurrency group
          # queues the new run until this one finishes and its commit has landed.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f .crawl_remaining ]; then echo "no work remaining"; exit 0; fi
          CHAIN=${{ inputs.chain }}; MAX=${{ inputs.max_chain }}
          if [ "$CHAIN" -ge "$MAX" ]; then echo "max_chain ($MAX) reached; not dispatching"; exit 0; fi
          echo "remaining: $(cat .crawl_remaining)"
          NEXT=$((CHAIN + 1))
          curl -sS -f -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "Content-Type: application/json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/crawl.yml/dispatches" \
            -d "$(jq -n --arg ref "$GITHUB_REF_NAME" --arg phase "${{ inputs.phase }}" --arg limit "${{ inputs.limit }}" \
                    --arg actions "${{ inputs.actions }}" --arg tbm "${{ inputs.time_budget_min }}" --arg extra "${{ inputs.extra_args }}" \
                    --arg chain "$NEXT" --arg max "$MAX" \
                    '{ref: $ref, inputs: {phase: $phase, limit: $limit, actions: $actions, time_budget_min: $tbm, extra_args: $extra, chain: $chain, max_chain: $max}}')"
          echo "dispatched chain $NEXT"
