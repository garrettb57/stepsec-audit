name: crawl

on:
  workflow_dispatch:
    inputs:
      phase:
        description: "all | discover | workflows | enrich | contacts | export"
        default: "all"
      limit:
        description: "Cap candidate repos (smoke test). Blank = no cap."
        default: ""
      actions:
        description: "Comma list of step-security action names to search. Blank = every public repo in the step-security org."
        default: ""
      time_budget_min:
        description: "Stop cleanly after this many minutes and commit state; re-run to resume."
        default: "330"
      extra_args:
        description: "Extra CLI flags, e.g. --skip-contacts --rediscover"
        default: ""

permissions:
  contents: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python -m pytest -q

      - name: Crawl
        env:
          # A classic or fine-grained PAT (public-repo read only) in CRAWLER_TOKEN raises
          # the REST limit from 1,000 to 5,000 req/h. GITHUB_TOKEN works without it.
          GITHUB_TOKEN: ${{ secrets.CRAWLER_TOKEN || secrets.GITHUB_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          ARGS="--phase ${{ inputs.phase }} --time-budget-min ${{ inputs.time_budget_min }}"
          if [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ inputs.limit }}"; fi
          if [ -n "${{ inputs.actions }}" ]; then ARGS="$ARGS --actions ${{ inputs.actions }}"; fi
          ARGS="$ARGS ${{ inputs.extra_args }}"
          echo "running: python -m crawler.main $ARGS"
          python -m crawler.main $ARGS

      - name: Commit data and state
        if: always()
        run: |
          git config user.name "stepsec-audit crawler"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data state
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "crawl: update data and state ($(date -u +%Y-%m-%dT%H:%MZ))"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stepsec-csv
          path: data/
          if-no-files-found: ignore
